[package]
name = "codex-desktop-next"
version = "0.1.0"
description = "An independent native desktop coding agent for Windows"
authors = ["Codex App contributors"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "codex_desktop_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-desktop-next"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
age = { version = "0.12.1", default-features = false }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
deno_core_icudata = "=0.77.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring-core = "1.0.0"
parking_lot = "0.12.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form", "json", "rustls", "stream", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.25.0", features = ["serde", "v5", "v7"] }
v8 = { version = "=150.4.0", features = ["v8_enable_sandbox"] }
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
