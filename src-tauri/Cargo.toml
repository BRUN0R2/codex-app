[package]
name = "codex-desktop-next"
version = "0.1.0"
description = "A lean Tauri desktop client for the Codex app-server"
authors = ["Codex App contributors"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "codex_desktop_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "sync", "time"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
which = "8.0.5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
