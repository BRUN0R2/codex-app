[package]
name = "codex-desktop-next"
version = "0.1.0"
description = "A modular native desktop foundation for a Codex-style agent"
authors = ["Codex App contributors"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "codex_desktop_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
age = { version = "0.12.1", default-features = false }
base64 = "0.23.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
keyring-core = "1.0.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "system-proxy"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
which = "8.0.5"
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
