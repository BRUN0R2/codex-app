name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.4.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high
      - name: Verify frontend
        run: pnpm verify:frontend

  native:
    name: Native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.4.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled runtime tools
        run: pnpm tools:bootstrap
      - name: Verify transitive dependency exception
        run: pnpm verify:transitive
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Check native code
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build desktop executable
        run: pnpm tauri build --debug --no-bundle
