name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.4.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high
      - name: Verify frontend
        run: pnpm verify:frontend

  native:
    name: Native Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.4.0
          cache: pnpm
      - name: Cache native build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/target/codex-desktop-next
          key: native-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml', 'scripts/v8-source-manifest.json') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled runtime tools
        run: pnpm tools:bootstrap
      - name: Verify transitive dependency exception
        run: pnpm verify:transitive
      - name: Check formatting
        run: pnpm native:cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Check native code
        run: pnpm native:cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Run Clippy
        run: pnpm native:cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -CargoTrailingArguments "--deny warnings"
      - name: Test native code
        run: pnpm native:cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Verify performance budgets
        run: pnpm verify:benchmarks
      - name: Build desktop executable
        run: pnpm tauri build --debug --no-bundle
