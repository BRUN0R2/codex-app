name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Signed Windows release
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.4.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and release version
        run: pnpm audit --audit-level high && pnpm verify && pnpm verify:version
      - name: Import Windows signing identity
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          $required = @(
            "WINDOWS_CERTIFICATE_BASE64",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "WINDOWS_CERTIFICATE_THUMBPRINT",
            "WINDOWS_PUBLISHER"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Release secret $name is required."
            }
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "codex-app-release.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($certificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw "Imported certificate thumbprint does not match WINDOWS_CERTIFICATE_THUMBPRINT."
          }
          $releaseConfig = @{
            bundle = @{
              publisher = $env:WINDOWS_PUBLISHER
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $releaseConfig | ConvertTo-Json -Depth 5 | `
            Set-Content -LiteralPath "src-tauri/tauri.release.generated.json" -Encoding utf8
          Remove-Item -LiteralPath $certificatePath -Force
      - name: Build, sign and publish installers
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex App v__VERSION__"
          releaseBody: "Instalador oficial assinado do Codex App para Windows."
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.generated.json
          releaseAssetNamePattern: "Codex-App_[version]_[arch][setup][ext]"
